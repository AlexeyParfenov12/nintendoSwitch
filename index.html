<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Document</title>
</head>

<body>
  <article>
    <div class="pg"></div>
    <section class="controller left">
      <div class="left-stick-one">
        <div class="left-stick-two"></div>
      </div>
      <div class="top-button">
        <div class="tr"></div>
      </div>
      <div class="right-button">
        <div class="tr"></div>
      </div>
      <div class="bottom-button">
        <div class="tr"></div>
      </div>
      <div class="left-button">
        <div class="tr"></div>
      </div>
    </section>
    <section class="controller right">
      <div class="right-stick-one">
        <div class="right-stick-two"></div>
      </div>
    </section>
    <section class="body">
      <div class="frame">
        <div class="screen">
          <div class="circle2"></div>
          <div class="circle1"></div>
          <div class="circle3"></div>
          <div class="circle4"></div>
          <div class="circle5"></div>
          <div class="circle6"></div>
          <div class="circle7"></div>
          <div class="screen2"></div>
            <div class="nintendo">
              <div class="left-nint"></div>
              <div class="right-nint"></div>
            </div>
            <div class="text-nintendo">NINTENDO</div>
            <div class="text-switch">SWITCH</div>
        </div>
      </div>
    </section>
  </article>
</body>

</html>
